{% extends "base.html" %}

{% block title %}Reset Password · Apex National Bank{% endblock %}

{% block content %}
<div class="auth-box">
  <div style="text-align: center; margin-bottom: 2rem;">
    <div class="feature-icon" style="margin: 0 auto 1rem;">🔑</div>
    <h1 style="font-size: 1.65rem; font-weight: 800; color: var(--secondary); margin-bottom: 0.25rem;">Reset Your Password</h1>
    <p style="color: var(--text-muted); font-size: 0.95rem;">Enter your username, email, or 12-digit account number to set a new password.</p>
  </div>

  <form method="post" action="{{ url_for('auth.forgot_password') }}">
    <div class="form-group">
      <label class="form-label" for="identifier">Account Identifier</label>
      <input class="form-control" id="identifier" name="identifier" type="text" placeholder="Username, email, or account number" required autofocus>
    </div>

    <div class="form-group">
      <label class="form-label" for="new_password">New Password</label>
      <input class="form-control" id="new_password" name="new_password" type="password" minlength="6" placeholder="At least 6 characters" required>
    </div>

    <div class="form-group">
      <label class="form-label" for="confirm_password">Confirm New Password</label>
      <input class="form-control" id="confirm_password" name="confirm_password" type="password" minlength="6" placeholder="Repeat new password" required>
    </div>

    <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top: 1.5rem;">
      Update Password Now
    </button>
  </form>

  <div style="text-align: center; margin-top: 1.75rem; padding-top: 1.25rem; border-top: 1px solid var(--border-light); font-size: 0.9rem; color: var(--text-muted);">
    Remembered your credentials? 
    <a href="{{ url_for('auth.login') }}" style="font-weight: 700;">Back to Sign In</a>
  </div>
</div>
{% endblock %}
