{% extends "base.html" %}

{% block title %}Sign In · Apex National Bank{% endblock %}

{% block content %}
<div class="auth-box">
  <div style="text-align: center; margin-bottom: 2rem;">
    <svg style="width: 48px; height: 48px; margin-bottom: 0.75rem;" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect width="40" height="40" rx="10" fill="#2563EB"/>
      <path d="M20 9L29 15V17H11V15L20 9Z" fill="white"/>
      <rect x="13" y="19" width="3" height="9" fill="white" fill-opacity="0.9"/>
      <rect x="18.5" y="19" width="3" height="9" fill="white" fill-opacity="0.9"/>
      <rect x="24" y="19" width="3" height="9" fill="white" fill-opacity="0.9"/>
      <rect x="11" y="29" width="18" height="2.5" rx="0.5" fill="white"/>
    </svg>
    <h1 style="font-size: 1.65rem; font-weight: 800; color: var(--secondary); margin-bottom: 0.25rem;">Sign In to Apex</h1>
    <p style="color: var(--text-muted); font-size: 0.95rem;">Enter your verified credentials to access your financial vault.</p>
  </div>

  <form method="post" action="{{ url_for('auth.login', next=request.args.get('next')) }}">
    <div class="form-group">
      <label class="form-label" for="username">Username or Email Address</label>
      <input class="form-control" id="username" name="username" type="text" placeholder="e.g. poorvi or admin" autocomplete="username" required autofocus>
    </div>

    <div class="form-group">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
        <label class="form-label" for="password" style="margin-bottom: 0;">Password</label>
        <a href="{{ url_for('auth.forgot_password') }}" style="font-size: 0.8rem; font-weight: 600;">Forgot password?</a>
      </div>
      <div class="input-icon-group">
        <input class="form-control" id="password" name="password" type="password" placeholder="Enter your password" autocomplete="current-password" required>
        <button type="button" data-toggle-password="password" style="position: absolute; right: 1rem; top: 50%; transform: translateY(-50%); background: none; border: none; font-size: 0.85rem; font-weight: 600; color: var(--primary); cursor: pointer;">Show</button>
      </div>
    </div>

    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem;">
      <label style="display: flex; align-items: center; gap: 0.5rem; font-size: 0.9rem; color: var(--text-main); cursor: pointer;">
        <input type="checkbox" name="remember" id="remember" style="width: 1rem; height: 1rem; accent-color: var(--primary);">
        Remember me on this device
      </label>
    </div>

    <button type="submit" class="btn btn-primary btn-block btn-lg">
      Secure Sign In ➔
    </button>
  </form>

  <div style="text-align: center; margin-top: 1.75rem; padding-top: 1.25rem; border-top: 1px solid var(--border-light); font-size: 0.9rem; color: var(--text-muted);">
    Don't have an account yet? 
    <a href="{{ url_for('auth.register') }}" style="font-weight: 700;">Open an Account</a>
  </div>

  <!-- Quick Demo Autofill Helper -->
  <div class="demo-credentials-card">
    <strong style="color: var(--secondary); display: block; margin-bottom: 0.5rem;">⚡ Demo Login Presets:</strong>
    <div style="display: flex; gap: 0.5rem; flex-wrap: wrap;">
      <button type="button" class="chip-btn" onclick="document.getElementById('username').value='poorvi'; document.getElementById('password').value='poorvi@123';">
        Customer (poorvi)
      </button>
      <button type="button" class="chip-btn" onclick="document.getElementById('username').value='alex_turner'; document.getElementById('password').value='Alex@123';">
        Customer (alex_turner)
      </button>
      <button type="button" class="chip-btn" onclick="document.getElementById('username').value='admin'; document.getElementById('password').value='Admin@123';">
        Admin (admin)
      </button>
    </div>
  </div>
</div>
{% endblock %}
